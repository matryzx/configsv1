# kitty.conf generated by Confitty, https://confitty.app
# Target: Kitty 0.48.0
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

allow_remote_control true

# --- Fonts ---
font_family JetBrains Mono
disable_ligatures cursor
font_size 13

# --- Cursor ---
cursor #ebdbb2
cursor_text_color #282828
cursor_blink_interval 0

# --- Scrollback ---
scrollback_lines 10000

# --- Mouse ---
url_color #83a598
copy_on_select clipboard
strip_trailing_spaces smart

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
window_border_width 1pt
active_border_color #fabd2f
inactive_text_alpha 0.75
confirm_os_window_close 1

# --- Tab Bar ---
tab_bar_style separator
tab_powerline_style slanted
active_tab_foreground #282828
active_tab_background #fabd2f
inactive_tab_foreground #a89984
inactive_tab_background #3c3836

# --- Colors ---
foreground #c4b695
background #0c0c0c
selection_foreground #282828
selection_background #ebdbb2
color0 #282828
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

background_opacity 0.6

window_margin_width 20

background_blur 0

confirm_os_window_close 0
