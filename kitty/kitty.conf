shell /usr/bin/fish

allow_remote_control true

window_margin_width 5

# --- Fonts ---
font_family JetBrains Mono
font_size 12
disable_ligatures cursor
modify_font cell_height 120%

# --- Cursor ---
cursor #ebdbb2
cursor_text_color #282828
cursor_shape beam
cursor_blink_interval 0.5

# --- Scrollback ---
scrollback_lines 10000
touch_scroll_multiplier 1.5

# --- Mouse ---
url_color #83a598
underline_hyperlinks always
copy_on_select clipboard
strip_trailing_spaces smart

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.2

# --- Window Layout ---
window_border_width 1pt
window_padding_width 8
active_border_color #fabd2f
inactive_text_alpha 0.75
hide_window_decorations yes
confirm_os_window_close 1

# --- Tab Bar ---
tab_bar_min_tabs 1
tab_powerline_style slanted
active_tab_foreground #c5c8c6
active_tab_background #b294bb
inactive_tab_foreground #8a8d8c
inactive_tab_background #424445

# --- Colors ---
foreground #c5c8c6
background #1d1f21
background_opacity 0.98
selection_foreground #1d1f21
selection_background #373b41
color1 #cc6666
color2 #b5bd68
color3 #f0c674
color4 #81a2be
color5 #b294bb
color6 #8abeb7
color7 #c5c8c6
color8 #969896
color9 #d54e53
color10 #b9ca4a
color11 #e7c547
color12 #7aa6da
color13 #c397d8
color14 #70c0b1
color15 #eaeaea
mark1_foreground #000000
mark1_background #ffff00
mark2_foreground #000000
mark2_background #00ffff
mark3_foreground #ffffff
mark3_background #ff0000
